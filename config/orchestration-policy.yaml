version: 1
planning:
  minMilestones: 3
  maxMilestones: 12
  minIssuesPerMilestone: 2
  maxIssuesPerMilestone: 8
  requireNonGoals: true
  requireSuccessMetrics: true
  requireAcceptanceCriteriaPerIssue: true
  requireDependencyRelations: true
  requireArchitectureSection: true
  requireRiskRegister: true
  requireRollbackForHighRiskChanges: true
  dialogue:
    description: "Soft gate for five-step planning dialogue before write plan (see 20-project-planning skill)"
    requireFourGrid: true
    minAlternatives: 2
    maxAlternatives: 3
    minAssumptionChallenges: 1
    requireFactAnchoring: true
    requireConvergenceBeforeWritePlan: true
    prohibitOptionSelectionBeforeSteps3And4: true
    requireFactAssumptionConsistencyInConvergedPlan: true
    promptInputBinding: use_user_message_when_placeholder_unreplaced
    outputFormat: two_section
    sections:
      - collaboration_dialogue
      - converged_plan
projectNaming:
  pattern: "repo-name｜中文描述"
  repoRequired: true
issueDesign:
  issueAtomicity: "one issue should be independently executable and reviewable"
  requireLabels:
    - difficulty
  recommendedLabels:
    - area
    - type
scope:
  maxProjectsPerRun: 1
  projectListMode: summary_only
