version: 2
mode: solo
description: Solo-operator write policy — one plan_confirmation, then mutate, readback diff, and audit.

levels:
  L0:
    description: read, fact pack, draft, report
    confirm: false
  L1_L2:
    description: comment, project update, create project, milestone, issue, relation
    confirm: once
    confirmVia: plan_confirmation
    requireReadback: true
    requireAudit: true
  L4:
    description: delete, archive, cancel projects, close many issues
    default: deny
  L5:
    description: secrets, tokens, personal sensitive data
    default: deny

mutationDefaults:
  dryRun: true
  confirmedByUser: false
  confirmOnceVia: ask_user_plan_confirmation
  auditLogRequired: true
  readbackRequired: true

protectedFields:
  - token
  - secret
  - password
  - apiKey
  - privateKey
